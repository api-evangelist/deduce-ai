aid: deduce-ai
name: Deduce
description: >-
  Deduce is a New York City-based identity intelligence and fraud-prevention
  company focused on detecting stolen and synthetic identities, including the
  rapidly growing class of AI-generated identities used to bypass traditional
  Know Your Customer and onboarding controls. The company operates the Deduce
  Identity Graph, an activity-backed U.S. identity network the firm describes
  as covering 185 million weekly active users and 1.5 billion daily events,
  used to deliver real-time multi-contextual risk and fraud signals during new
  account opening, login, and checkout. Deduce sells a real-time API-based
  fraud-risk scoring product, a Multicontextual Identity Insights service,
  and a browser-based dashboard for traffic segmentation, anomaly detection,
  and forensic review, with pre-built integrations into common identity
  platforms (Auth0, Microsoft Entra External ID / Azure AD B2C, ForgeRock /
  Ping, Gluu) alongside a native REST API. The company sells to banks,
  fintechs, lenders, BNPL providers, retail, travel, and payments platforms;
  its commercial model is enterprise contracts, and its developer
  documentation, OpenAPI definitions, and integration guides sit behind an
  authenticated portal, with no public GitHub repositories, no public SDKs,
  and no published machine-readable API specification.
